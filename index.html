<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>釜山 4天自由行</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pixel: {
              cream: '#FAF3D3',
              card: '#FFFFFF',
              blue: '#38647A',
              sky: '#5389A3',
              red: '#ED4C4C',
            }
          },
          fontFamily: {
            sans: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'sans-serif'],
            pixel: ['"DotGothic16"', '"Press Start 2P"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF3D3;
      background-image: radial-gradient(#E5D7A0 25%, transparent 25%);
      background-size: 8px 8px;
      color: #38647A;
      min-height: 100vh;
      image-rendering: pixelated;
      position: relative;
    }

    .busan-bg-illustration {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      opacity: 0.38;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    .banner-card {
      background-color: #38647A;
      background-image: repeating-linear-gradient(45deg, rgba(83, 137, 163, 0.25) 0, rgba(83, 137, 163, 0.25) 4px, transparent 4px, transparent 8px);
      border: 4px solid #1E3A4A;
      box-shadow: 0 8px 0px #1E3A4A;
      border-radius: 16px;
      position: relative;
    }

    .banner-card::before, .banner-card::after, .pixel-card::before, .pixel-card::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 14px;
      height: 24px;
      transform: translateY(-50%);
      z-index: 10;
    }
    .banner-card::before { left: -14px; background-color: #38647A; border: 4px solid #1E3A4A; border-right: none; border-radius: 6px 0 0 6px; }
    .banner-card::after { right: -14px; background-color: #38647A; border: 4px solid #1E3A4A; border-left: none; border-radius: 0 6px 6px 0; }

    .pixel-card {
      background-color: #FFFFFF;
      border: 4px solid #38647A;
      box-shadow: 0 8px 0px #38647A;
      border-radius: 16px;
      position: relative;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .pixel-card::before { left: -14px; background-color: #FFFFFF; border: 4px solid #38647A; border-right: none; border-radius: 6px 0 0 6px; }
    .pixel-card::after { right: -14px; background-color: #FFFFFF; border: 4px solid #38647A; border-left: none; border-radius: 0 6px 6px 0; }

    .tab-container {
      background-color: #38647A;
      border: 4px solid #1E3A4A;
      box-shadow: 0 6px 0 #1E3A4A;
      border-radius: 20px;
    }

    .day-tab {
      background-color: #FFFFFF;
      color: #38647A;
      border: 3px solid #1E3A4A;
      box-shadow: 0 4px 0 #1E3A4A;
      font-family: 'DotGothic16', monospace;
      transition: all 0.15s ease;
    }
    .day-tab-active {
      background-color: #ED4C4C !important;
      color: #FFFFFF !important;
      box-shadow: 0 6px 0 #1E3A4A !important;
      transform: translateY(-3px);
    }

    .drawer-overlay { transition: opacity 0.3s ease; }
    .drawer-content { transition: transform 0.3s ease-in-out; }

    @keyframes pixel-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-pixel-bounce { animation: pixel-bounce 1.5s infinite ease-in-out; }
  </style>
</head>
<body class="pb-20 font-sans">

  <div class="busan-bg-illustration">
    <svg class="w-full h-full object-cover object-bottom" viewBox="0 0 1000 1200" preserveAspectRatio="xMidYMax slice" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 420Q500 480 1000 420M0 460Q500 520 1000 460M0 500Q500 560 1000 500" stroke="#38647A" stroke-width="2" stroke-dasharray="8 4" opacity="0.45"/>
      <g id="left-utility-pole">
        <rect x="50" y="250" width="16" height="750" fill="#38647A"/>
        <rect x="10" y="320" width="100" height="12" fill="#38647A"/>
        <rect x="0" y="380" width="130" height="12" fill="#38647A"/>
      </g>
      <rect x="0" y="760" width="1000" height="180" fill="#38647A" fill-opacity="0.22"/>
      <path d="M0 760h1000v10H0z" fill="#38647A" opacity="0.4"/>
      <g id="traffic-light">
        <rect x="680" y="550" width="14" height="400" fill="#38647A"/>
        <rect x="620" y="620" width="140" height="30" fill="#1E3A4A" rx="4"/>
        <circle cx="650" cy="635" r="9" fill="#ED4C4C"/>
        <circle cx="690" cy="635" r="9" fill="#EFE5B8"/>
        <circle cx="730" cy="635" r="9" fill="#38647A"/>
      </g>
      <g id="small-busan-tram">
        <rect x="-40" y="810" width="500" height="150" rx="10" fill="#38647A"/>
        <rect x="-30" y="850" width="480" height="95" fill="#FAF3D3"/>
        <rect x="-30" y="900" width="480" height="45" fill="#ED4C4C"/>
        <rect x="20" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <rect x="105" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <rect x="190" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <rect x="275" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <rect x="360" y="825" width="100" height="60" rx="6" fill="#1E3A4A"/>
      </g>
      <rect x="0" y="960" width="1000" height="240" fill="#38647A" opacity="0.25"/>
    </svg>
  </div>

  <button onclick="toggleDrawer()" class="fixed top-5 left-5 z-40 bg-pixel-cream text-pixel-blue font-bold px-4 py-2.5 rounded-xl border-4 border-pixel-blue shadow-[0_4px_0_#1E3A4A] hover:bg-white active:translate-y-1 transition-all font-pixel text-sm flex items-center gap-2.5">
    <i class="fa-solid fa-toolbox text-base text-pixel-red"></i>
    <span>工具箱</span>
  </button>

  <header class="max-w-4xl mx-auto mt-6 px-4">
    <div class="banner-card p-6 md:p-8 text-center relative overflow-hidden text-white">
      <div class="inline-block bg-pixel-red text-white text-xs px-3 py-1 border-2 border-[#1E3A4A] rounded-md mb-3 font-pixel tracking-widest shadow-sm animate-pixel-bounce">
        <i class="fa-solid fa-plane-arrival mr-1"></i> BUSAN TRAVEL GUIDE 2026
      </div>
      <h1 class="text-3xl md:text-5xl font-black font-pixel tracking-widest my-2 mb-4 text-pixel-cream drop-shadow-[0_4px_0_#1E3A4A]">
        Trip to Busan
      </h1>
      <div class="flex justify-between items-end px-6 mt-6 border-b-2 border-dashed border-pixel-cream/20 pb-2 select-none">
        <svg class="w-8 h-5 opacity-90" viewBox="0 0 32 20" fill="#FAF3D3"><path d="M12 2h4v8h-4zm-8 8h16v3H4zm-4 3h24v4H0z"/></svg>
        <div class="text-pixel-cream/90 text-sm md:text-base font-pixel">Made By Kuan</div>
        <svg class="w-8 h-5 opacity-90" viewBox="0 0 32 20" fill="#FAF3D3"><path d="M12 2h4v8h-4zm-8 8h16v3H4zm-4 3h24v4H0z"/></svg>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8">
    <div class="tab-container p-4 pt-5 mb-6 flex flex-col md:flex-row justify-between items-center gap-3 overflow-visible">
      <div class="flex justify-between gap-2 w-full md:w-auto overflow-visible py-1">
        <button onclick="switchDay(1)" id="tab-1" class="day-tab day-tab-active flex-1 md:flex-none px-4 py-2.5 text-center rounded-xl">Day 1</button>
        <button onclick="switchDay(2)" id="tab-2" class="day-tab flex-1 md:flex-none px-4 py-2.5 text-center rounded-xl">Day 2</button>
        <button onclick="switchDay(3)" id="tab-3" class="day-tab flex-1 md:flex-none px-4 py-2.5 text-center rounded-xl">Day 3</button>
        <button onclick="switchDay(4)" id="tab-4" class="day-tab flex-1 md:flex-none px-4 py-2.5 text-center rounded-xl">Day 4</button>
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto justify-end bg-pixel-cream/20 p-1.5 rounded-xl border-2 border-pixel-cream/30">
        <span class="text-xs font-pixel text-pixel-cream whitespace-nowrap"><i class="fa-solid fa-filter mr-1"></i>成員:</span>
        <select id="filter-traveler" onchange="filterTraveler(this.value)" class="bg-pixel-cream text-pixel-blue font-pixel text-xs py-1.5 px-2 rounded-lg border-2 border-pixel-blue focus:outline-none">
          <option value="all">全部成員 (All)</option>
          <option value="Kuan">僅看 Kuan</option>
          <option value="Lily">僅看 Lily</option>
        </select>
      </div>
    </div>

    <div id="itinerary-container" class="space-y-6">
      <div class="pixel-card p-10 text-center text-pixel-blue font-pixel">
        <i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-pixel-red"></i>
        <p class="text-base">載入釜山行程資料中...</p>
      </div>
    </div>

    <div id="bottom-nav-container" class="mt-8 flex justify-between items-center gap-4">
      <button id="prev-day-btn" onclick="goToPrevDay()" class="pixel-card flex-1 py-3 px-4 text-center font-pixel text-sm text-pixel-blue bg-pixel-cream hover:bg-white transition-colors flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> 上一天
      </button>
      <button id="next-day-btn" onclick="goToNextDay()" class="pixel-card flex-1 py-3 px-4 text-center font-pixel text-sm bg-pixel-red text-white hover:bg-red-600 transition-colors flex items-center justify-center gap-2">
        下一天 <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </main>

  <div id="drawer" class="fixed inset-0 z-50 pointer-events-none">
    <div id="drawer-overlay" onclick="toggleDrawer()" class="drawer-overlay absolute inset-0 bg-pixel-blue/60 backdrop-blur-sm opacity-0 pointer-events-none"></div>
    
    <div id="drawer-content" class="drawer-content absolute top-0 left-0 w-full max-w-md h-full bg-[#FAF3D3] border-r-4 border-pixel-blue shadow-2xl p-6 overflow-y-auto -translate-x-full pointer-events-auto flex flex-col">
      <div class="flex justify-between items-center pb-4 border-b-2 border-dashed border-pixel-blue/30 mb-4">
        <h2 class="text-lg font-pixel font-bold text-pixel-blue"><i class="fa-solid fa-toolbox mr-2 text-pixel-red"></i>釜山隨身工具箱</h2>
        <button onclick="toggleDrawer()" class="text-pixel-blue hover:text-pixel-red text-xl font-pixel"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="flex gap-2 mb-6 font-pixel text-xs border-2 border-pixel-blue p-1 rounded-xl bg-pixel-blue/10">
        <button onclick="switchMenuTab('calc')" id="menu-tab-calc" class="flex-1 py-2 text-center rounded-lg bg-pixel-blue text-white font-bold">匯率計算機</button>
        <button onclick="switchMenuTab('accounting')" id="menu-tab-accounting" class="flex-1 py-2 text-center rounded-lg text-pixel-blue font-bold">記帳小幫手</button>
      </div>

      <div id="menu-content-calc" class="space-y-4">
        <div class="pixel-card p-4 bg-white">
          <div class="flex justify-between items-center mb-3 border-b-2 border-pixel-cream pb-2">
            <h3 class="font-pixel text-sm text-pixel-blue font-bold"><i class="fa-solid fa-calculator mr-1"></i>韓元 / 台幣 匯率計算</h3>
            <span id="rate-status" class="text-[10px] font-pixel text-emerald-800 bg-emerald-200 px-2 py-0.5 rounded border border-emerald-800">載入即時匯率...</span>
          </div>
          
          <div class="space-y-3 font-pixel text-xs">
            <div>
              <label class="block text-pixel-blue/70 mb-1">韓元金額 (KRW ₩):</label>
              <input type="number" id="calc-krw" oninput="convertCurrency('krw')" placeholder="輸入韓幣金額..." class="w-full bg-pixel-cream/40 p-2.5 rounded-lg border-2 border-pixel-blue text-sm focus:outline-none">
            </div>
            <div class="text-center text-pixel-red py-1"><i class="fa-solid fa-right-left rotate-90 text-base"></i></div>
            <div>
              <label class="block text-pixel-blue/70 mb-1">折合台幣 (TWD $):</label>
              <input type="number" id="calc-twd" oninput="convertCurrency('twd')" placeholder="折合台幣..." class="w-full bg-pixel-cream/40 p-2.5 rounded-lg border-2 border-pixel-blue text-sm focus:outline-none">
            </div>
            <div class="bg-pixel-cream/50 p-2.5 rounded-lg border border-pixel-blue/30 text-[11px] text-pixel-blue/80 leading-relaxed mt-2">
              <i class="fa-solid fa-globe mr-1 text-pixel-blue"></i> 目前參考匯率：1 TWD ≈ <span id="rate-display" class="font-bold text-pixel-red">42.5</span> KRW
            </div>
          </div>
        </div>
      </div>

      <div id="menu-content-accounting" class="space-y-4 hidden">
        <div class="pixel-card p-4 bg-white space-y-3">
          <h3 class="font-pixel text-sm text-pixel-blue font-bold border-b-2 border-pixel-cream pb-1"><i class="fa-solid fa-pen-to-square mr-1"></i> 新增花費記錄</h3>
          
          <div class="space-y-2 font-pixel text-xs">
            <input type="text" id="expense-title" placeholder="項目 (例如：海雲台炒年糕)" class="w-full p-2 bg-pixel-cream/40 rounded border-2 border-pixel-blue">
            <div class="flex gap-2">
              <input type="number" id="expense-amount" placeholder="金額 (KRW ₩)" class="flex-1 p-2 bg-pixel-cream/40 rounded border-2 border-pixel-blue">
              <select id="expense-payer" class="p-2 bg-pixel-cream/40 rounded border-2 border-pixel-blue">
                <option value="Kuan">Kuan 付</option>
                <option value="Lily">Lily 付</option>
                <option value="公金">公金付</option>
              </select>
            </div>
            <button onclick="addExpense()" class="w-full py-2 bg-pixel-red text-white rounded-lg border-2 border-pixel-blue font-pixel shadow-sm hover:bg-red-600">新增記帳</button>
          </div>
        </div>

        <div class="pixel-card p-4 bg-white space-y-3">
          <div class="flex justify-between items-center font-pixel text-xs text-pixel-blue border-b-2 border-pixel-cream pb-2">
            <span class="font-bold">累積總花費:</span>
            <span id="total-expense-krw" class="text-pixel-red font-bold text-sm">₩0</span>
          </div>

          <div id="expense-list" class="space-y-2 max-h-56 overflow-y-auto text-xs font-sans">
          </div>

          <div class="pt-2 border-t border-dashed border-pixel-blue/20 flex gap-2">
            <button onclick="exportExpensesToCSV()" class="flex-1 py-1.5 bg-emerald-700 text-white rounded font-pixel text-[11px] hover:bg-emerald-800 border border-emerald-900">
              <i class="fa-solid fa-file-excel mr-1"></i>匯出 CSV 明細
            </button>
            <button onclick="clearCustomExpenses()" class="py-1.5 px-3 bg-gray-200 text-slate-700 rounded font-pixel text-[11px] hover:bg-red-100 hover:text-pixel-red border border-gray-400">
              重置手動花費
            </button>
          </div>
        </div>
      </div>

      <div class="mt-auto pt-4 text-center font-pixel text-[10px] text-pixel-blue/40">Busan Travel Tool ■ 2026</div>
    </div>
  </div>

  <div id="taxi-modal" class="fixed inset-0 bg-pixel-blue/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="pixel-card max-w-lg w-full p-6 text-center relative border-4 border-pixel-blue bg-[#FFFFFF] shadow-2xl">
      <button onclick="closeTaxiModal()" class="absolute top-3 right-3 text-pixel-blue hover:text-pixel-red text-2xl font-pixel"><i class="fa-solid fa-square-xmark"></i></button>
      <div class="inline-block bg-pixel-red text-white text-xs px-3 py-1 rounded border-2 border-pixel-blue mb-3 font-pixel">
        <i class="fa-solid fa-taxi mr-1"></i> 計程車大字報
      </div>
      <h3 id="modal-title" class="text-lg font-bold text-pixel-blue mb-3 font-pixel">目的地</h3>
      <div class="bg-pixel-cream/40 rounded-xl p-5 mb-4 border-3 border-pixel-blue">
        <p id="modal-msg" class="text-2xl md:text-3xl text-slate-900 leading-snug font-pixel">안녕하세요! 기사님, 이 주소로 가주세요.</p>
        <hr class="my-3 border-dashed border-pixel-blue/30">
        <p id="modal-address" class="text-sm text-pixel-red font-pixel select-all">주소 情報</p>
      </div>
      <p class="text-xs text-pixel-blue/70 font-pixel">💡 提示：按住文字可複製地址或出示給司機觀看。</p>
    </div>
  </div>

  <div id="station-modal" class="fixed inset-0 bg-pixel-blue/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="pixel-card max-w-lg w-full p-5 relative border-4 border-pixel-blue bg-[#FFFFFF] shadow-2xl space-y-3">
      <button onclick="closeStationModal()" class="absolute top-3 right-3 text-pixel-blue hover:text-pixel-red text-2xl font-pixel"><i class="fa-solid fa-square-xmark"></i></button>
      <div class="inline-block bg-pixel-blue text-white text-xs px-3 py-1 rounded border border-pixel-blue font-pixel">
        <i class="fa-solid fa-location-dot mr-1"></i> <span id="station-type-label">站點說明</span>
      </div>
      <h3 id="station-title" class="text-lg font-bold text-pixel-blue font-pixel">站點名稱</h3>
      <div class="border-2 border-pixel-blue rounded-lg overflow-hidden bg-pixel-cream/30">
        <img id="station-img" src="" alt="站點示意圖" class="w-full h-48 object-cover">
      </div>
      <p id="station-desc" class="text-xs text-pixel-blue leading-relaxed font-sans bg-pixel-cream/40 p-3 rounded-lg border border-pixel-blue/30"></p>
    </div>
  </div>

  <div id="image-modal" onclick="closeImageModal()" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 cursor-pointer">
    <div class="max-w-3xl w-full p-2 relative">
      <img id="enlarged-image" src="" class="w-full max-h-[85vh] object-contain rounded-lg border-4 border-white shadow-2xl">
      <p class="text-center text-white font-pixel text-xs mt-2">點擊任意處關閉</p>
    </div>
  </div>

  <script>
    let itineraryData = [];
    let presetExpenses = [];
    let userExpenses = JSON.parse(localStorage.getItem('busan_user_expenses')) || [];
    let currentDay = 1;
    let selectedTraveler = 'all';
    let currentRate = 42.5;

    async function initApp() {
      fetchItinerary();
      fetchPresetExpenses();
      fetchLiveExchangeRate();
    }

    async function fetchPresetExpenses() {
      try {
        const res = await fetch('data/expenses.json');
        if (res.ok) {
          presetExpenses = await res.json();
          renderExpenses();
        }
      } catch (e) {
        console.warn('未讀取到 data/expenses.json');
      }
    }

    async function fetchLiveExchangeRate() {
      const statusEl = document.getElementById('rate-status');
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/TWD');
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data && data.rates && data.rates.KRW) {
          currentRate = parseFloat(data.rates.KRW.toFixed(2));
          document.getElementById('rate-display').innerText = currentRate;
          statusEl.innerText = '● 即時國際匯率';
          statusEl.className = 'text-[10px] font-pixel text-emerald-800 bg-emerald-200 px-2 py-0.5 rounded border border-emerald-800';
        }
      } catch (e) {
        statusEl.innerText = '● 備用預設匯率';
        statusEl.className = 'text-[10px] font-pixel text-amber-800 bg-amber-200 px-2 py-0.5 rounded border border-amber-800';
      }
    }

    async function fetchItinerary() {
      try {
        const response = await fetch('data/itinerary.json');
        if (!response.ok) throw new Error('無法讀取行程資料');
        itineraryData = await response.json();
        renderDay(currentDay);
        updateBottomNavButtons();
      } catch (error) {
        console.error(error);
        document.getElementById('itinerary-container').innerHTML = `
          <div class="pixel-card p-8 text-center text-pixel-red font-pixel">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p>資料載入失敗，請確認 data/itinerary.json 檔案路徑。</p>
          </div>
        `;
      }
    }

    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.day-tab').forEach((tab, index) => {
        tab.classList.toggle('day-tab-active', index + 1 === day);
      });
      renderDay(day);
      updateBottomNavButtons();
    }

    function updateBottomNavButtons() {
      document.getElementById('prev-day-btn').style.visibility = currentDay === 1 ? 'hidden' : 'visible';
      document.getElementById('next-day-btn').style.visibility = currentDay === 4 ? 'hidden' : 'visible';
    }

    function goToNextDay() {
      if (currentDay < 4) { switchDay(currentDay + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    }

    function goToPrevDay() {
      if (currentDay > 1) { switchDay(currentDay - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    }

    function filterTraveler(traveler) {
      selectedTraveler = traveler;
      renderDay(currentDay);
    }

    function renderDay(day) {
      const container = document.getElementById('itinerary-container');
      let dayData = itineraryData.filter(item => item.day === day);
      
      if (selectedTraveler !== 'all') {
        dayData = dayData.filter(item => item.travelers && item.travelers.includes(selectedTraveler));
      }

      if (dayData.length === 0) {
        container.innerHTML = `<div class="pixel-card p-10 text-center text-pixel-blue font-pixel">尚無符合條件的行程資料。</div>`;
        return;
      }

      container.innerHTML = dayData.map(spot => {
        const travelersHtml = spot.travelers ? spot.travelers.map(t => {
          const bgClass = t === 'Kuan' ? 'bg-blue-100 text-blue-900 border-blue-900' : 'bg-pink-100 text-pink-900 border-pink-900';
          return `<span class="inline-block border-2 px-2 py-0.5 rounded text-xs font-pixel mr-1 ${bgClass}"><i class="fa-solid fa-user text-[10px] mr-1"></i>${t}</span>`;
        }).join('') : '';

        // 機場熱門設施與咖啡 (改用 Icon)
        const airportFacilitiesHtml = spot.airport_facilities && spot.airport_facilities.length > 0 ? `
          <div class="mt-4 pt-3 border-t-2 border-dashed border-pixel-blue/30 space-y-3">
            <p class="text-xs font-pixel text-pixel-blue font-bold uppercase"><i class="fa-solid fa-plane-departure mr-1 text-pixel-red"></i>機場熱門設施與咖啡推薦：</p>
            <div class="space-y-3">
              ${spot.airport_facilities.map(cat => {
                const iconClass = cat.category.includes('咖啡') || cat.category.includes('甜點') ? 'fa-mug-saucer' : 'fa-bag-shopping';
                return `
                  <div class="bg-pixel-cream/40 p-3 rounded-xl border-2 border-pixel-blue space-y-2">
                    <h4 class="font-pixel text-xs text-pixel-red font-bold flex items-center gap-1.5">
                      <i class="fa-solid ${iconClass}"></i>
                      <span>${cat.category}</span>
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                      ${cat.items.map(item => `
                        <div class="bg-white p-2 rounded-lg border border-pixel-blue/40 text-xs font-sans space-y-0.5">
                          <div class="flex justify-between items-center font-bold text-pixel-blue">
                            <span>${item.name}</span>
                            <span class="text-[10px] bg-pixel-blue/10 px-1.5 py-0.5 rounded font-pixel">${item.location}</span>
                          </div>
                          <p class="text-[11px] text-slate-600"><i class="fa-regular fa-clock mr-1"></i>${item.hours}</p>
                          <p class="text-[11px] text-pixel-red/90">${item.desc}</p>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        ` : '';

        // 下午茶推薦
        const cafesHtml = spot.cafe_list && spot.cafe_list.length > 0 ? `
          <div class="mt-4 pt-3 border-t-2 border-dashed border-pixel-blue/30 space-y-2">
            <p class="text-xs font-pixel text-pixel-red uppercase flex items-center gap-1"><i class="fa-solid fa-mug-hot mr-1"></i>特色下午茶 / 麵包店推薦：</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              ${spot.cafe_list.map(cafe => `
                <div class="bg-pixel-cream/40 p-3 rounded-xl border-2 border-pixel-blue space-y-1">
                  <div class="flex justify-between items-start">
                    <span class="font-bold text-xs text-pixel-blue font-sans">${cafe.name_zh}</span>
                    ${cafe.naver_link ? `<a href="${cafe.naver_link}" target="_blank" class="text-[10px] font-pixel text-emerald-800 bg-emerald-200 px-1.5 py-0.5 rounded border border-emerald-800"><i class="fa-solid fa-map-location-dot"></i> 地圖</a>` : ''}
                  </div>
                  <p class="text-[11px] text-pixel-blue/60 font-pixel">${cafe.name_kr}</p>
                  <p class="text-[11px] text-slate-700 select-all font-sans"><i class="fa-solid fa-location-dot text-pixel-red mr-1"></i>${cafe.address_kr}</p>
                  ${cafe.recommendation ? `<p class="text-[11px] text-pixel-red font-bold font-sans mt-1">★ ${cafe.recommendation}</p>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        ` : '';

        // 行程相片藝廊
        const photosHtml = spot.photos && spot.photos.length > 0 ? `
          <div class="mt-4 pt-3 border-t-2 border-dashed border-pixel-blue/30">
            <p class="text-xs font-pixel text-pixel-blue/70 mb-2"><i class="fa-solid fa-camera mr-1"></i>景點相片與備忘：</p>
            <div class="flex gap-2 overflow-x-auto pb-1">
              ${spot.photos.map(p => `
                <img src="${p}" onclick="openImageModal('${p}')" class="w-24 h-24 object-cover rounded-lg border-2 border-pixel-blue cursor-pointer hover:opacity-80 transition-opacity flex-shrink-0">
              `).join('')}
            </div>
          </div>
        ` : '';

        // 交通轉乘
        const transitHtml = spot.transit_options && spot.transit_options.length > 0 ? `
          <div class="mt-4 pt-3 border-t-2 border-dashed border-pixel-blue/30 space-y-2">
            <p class="text-xs font-pixel text-pixel-blue/70 uppercase"><i class="fa-solid fa-route mr-1"></i>交通與轉乘方式：</p>
            ${spot.transit_options.map(t => {
              const isNonVehicle = t.type && (t.type.includes('徒步') || t.type.includes('步行') || t.type.includes('計程車') || t.type.includes('走路'));
              const startLabel = isNonVehicle ? '出發' : '上車';
              const endLabel = isNonVehicle ? '抵達' : '下車';

              const renderStationText = (nameZh, nameKr, imgSrc, desc, labelType) => {
                if (!nameZh) return '';
                if (imgSrc) {
                  return `
                    <span onclick='openStationModal("${nameZh}", "${imgSrc}", "${desc || ''}", "${labelType}")' class="underline decoration-pixel-red decoration-2 cursor-pointer font-bold text-pixel-blue hover:text-pixel-red">
                      ${nameZh} ${nameKr ? `(${nameKr})` : ''} <i class="fa-regular fa-image text-[10px]"></i>
                    </span>
                  `;
                }
                return `<span class="font-bold text-pixel-blue">${nameZh} ${nameKr ? `(${nameKr})` : ''}</span>`;
              };

              return `
                <div class="bg-pixel-cream/30 p-3 rounded-lg border-2 border-pixel-blue text-sm font-sans">
                  <div class="flex justify-between items-center mb-1 font-pixel">
                    <span class="text-pixel-red"><i class="fa-solid fa-bus-simple mr-1"></i>${t.type}</span>
                    <span class="text-xs bg-pixel-blue/10 text-pixel-blue px-2 py-0.5 rounded border border-pixel-blue">₩${t.cost_krw ? t.cost_krw.toLocaleString() : 0} (${t.duration_mins}分)</span>
                  </div>
                  <p class="text-xs text-pixel-blue">${t.route_description}</p>
                  ${t.board_zh ? `<p class="text-xs text-slate-700 mt-1">${startLabel}：${renderStationText(t.board_zh, t.board_kr, t.board_img, t.board_desc, `${startLabel}站點`)}</p>` : ''}
                  ${t.transfer_zh ? `<p class="text-xs text-slate-700 mt-0.5">轉乘：${renderStationText(t.transfer_zh, t.transfer_kr, t.transfer_img, t.transfer_desc, '轉乘站點')}</p>` : ''}
                  ${t.alight_zh ? `<p class="text-xs text-slate-700 mt-0.5">${endLabel}：${renderStationText(t.alight_zh, t.alight_kr, t.alight_img, t.alight_desc, `${endLabel}站點`)}</p>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        ` : '';

        const taxiBtnHtml = spot.taxi_card ? `
          <button onclick='openTaxiModal(${JSON.stringify(spot.taxi_card)})' class="mt-4 w-full bg-pixel-red hover:bg-red-600 text-white border-2 border-pixel-blue font-pixel text-xs py-2.5 px-4 rounded-xl flex items-center justify-center shadow-[0_3px_0_#1E3A4A]">
            <i class="fa-solid fa-taxi mr-2"></i>開啟計程車溝通大字報
          </button>
        ` : '';

        return `
          <div class="pixel-card p-5 md:p-6 relative">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-pixel text-white bg-pixel-blue px-2.5 py-1 rounded border border-pixel-blue">
                <i class="fa-regular fa-clock mr-1"></i>${spot.time}
              </span>
              <div>${travelersHtml}</div>
            </div>
            <h2 class="text-xl md:text-2xl text-pixel-blue my-2 flex items-center justify-between font-sans">
              <span>${spot.spot_zh}</span>
              ${spot.naver_link ? `
                <a href="${spot.naver_link}" target="_blank" class="text-xs font-pixel text-emerald-800 bg-emerald-200 px-2.5 py-1 rounded border-2 border-emerald-800 ml-2">
                  <i class="fa-solid fa-map-location-dot mr-1"></i>Naver Map
                </a>
              ` : ''}
            </h2>
            <p class="text-xs font-pixel text-pixel-blue/60 mb-3">${spot.spot_kr || ''}</p>
            ${spot.notes ? `<div class="bg-pixel-cream/50 p-3 rounded-lg border-2 border-pixel-blue text-xs text-pixel-blue leading-relaxed font-sans"><i class="fa-solid fa-circle-info text-pixel-red mr-1"></i><strong>注意事項：</strong> ${spot.notes}</div>` : ''}
            ${airportFacilitiesHtml}
            ${cafesHtml}
            ${photosHtml}
            ${transitHtml}
            ${taxiBtnHtml}
          </div>
        `;
      }).join('');
    }

    function toggleDrawer() {
      const overlay = document.getElementById('drawer-overlay');
      const content = document.getElementById('drawer-content');
      const isOpen = !content.classList.contains('-translate-x-full');

      if (isOpen) {
        content.classList.add('-translate-x-full');
        overlay.classList.add('opacity-0', 'pointer-events-none');
      } else {
        content.classList.remove('-translate-x-full');
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        renderExpenses();
      }
    }

    function switchMenuTab(tab) {
      document.getElementById('menu-content-calc').classList.toggle('hidden', tab !== 'calc');
      document.getElementById('menu-content-accounting').classList.toggle('hidden', tab !== 'accounting');
      document.getElementById('menu-tab-calc').className = tab === 'calc' ? 'flex-1 py-2 text-center rounded-lg bg-pixel-blue text-white font-bold' : 'flex-1 py-2 text-center rounded-lg text-pixel-blue font-bold';
      document.getElementById('menu-tab-accounting').className = tab === 'accounting' ? 'flex-1 py-2 text-center rounded-lg bg-pixel-blue text-white font-bold' : 'flex-1 py-2 text-center rounded-lg text-pixel-blue font-bold';
    }

    function convertCurrency(type) {
      const krwInput = document.getElementById('calc-krw');
      const twdInput = document.getElementById('calc-twd');

      if (type === 'krw') {
        const krw = parseFloat(krwInput.value);
        twdInput.value = isNaN(krw) ? '' : Math.round(krw / currentRate);
      } else {
        const twd = parseFloat(twdInput.value);
        krwInput.value = isNaN(twd) ? '' : Math.round(twd * currentRate);
      }
    }

    function addExpense() {
      const title = document.getElementById('expense-title').value.trim();
      const amount = parseFloat(document.getElementById('expense-amount').value);
      const payer = document.getElementById('expense-payer').value;

      if (!title || isNaN(amount) || amount <= 0) {
        alert('請填寫有效的項目與金額！');
        return;
      }

      userExpenses.push({ id: Date.now(), title, amount, payer });
      localStorage.setItem('busan_user_expenses', JSON.stringify(userExpenses));

      document.getElementById('expense-title').value = '';
      document.getElementById('expense-amount').value = '';
      renderExpenses();
    }

    function renderExpenses() {
      const listContainer = document.getElementById('expense-list');
      const totalContainer = document.getElementById('total-expense-krw');
      let totalKRW = 0;

      const combinedExpenses = [
        ...presetExpenses.map(p => ({ ...p, isPreset: true })),
        ...userExpenses.map(u => ({ ...u, isPreset: false }))
      ];

      if (combinedExpenses.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-pixel-blue/50 py-4 font-pixel text-xs">尚無記帳記錄</p>`;
      } else {
        listContainer.innerHTML = combinedExpenses.map(item => {
          const displayAmount = item.amount || Math.round(item.amount_twd * currentRate);
          totalKRW += displayAmount;

          return `
            <div class="flex justify-between items-center bg-pixel-cream/30 p-2 rounded border border-pixel-blue/30">
              <div>
                <span class="font-bold text-pixel-blue">${item.title}</span>
                <span class="text-[10px] bg-pixel-blue/10 px-1.5 py-0.5 rounded text-pixel-blue ml-1">${item.payer}</span>
                ${item.amount_twd ? `<span class="text-[10px] text-gray-500 ml-1">(NT$${item.amount_twd})</span>` : ''}
              </div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-pixel-red">₩${displayAmount.toLocaleString()}</span>
                ${!item.isPreset ? `
                  <button onclick="deleteUserExpense(${item.id})" class="text-pixel-blue/40 hover:text-pixel-red"><i class="fa-solid fa-trash-can"></i></button>
                ` : `<span class="text-[10px] text-emerald-700 bg-emerald-100 px-1 rounded">預訂</span>`}
              </div>
            </div>
          `;
        }).join('');
      }

      totalContainer.innerText = `₩${totalKRW.toLocaleString()}`;
    }

    function deleteUserExpense(id) {
      userExpenses = userExpenses.filter(item => item.id !== id);
      localStorage.setItem('busan_user_expenses', JSON.stringify(userExpenses));
      renderExpenses();
    }

    function clearCustomExpenses() {
      if (confirm('確定要清空現場新增的手動花費嗎？（預設行程花費不受影響）')) {
        userExpenses = [];
        localStorage.removeItem('busan_user_expenses');
        renderExpenses();
      }
    }

    function exportExpensesToCSV() {
      const combined = [
        ...presetExpenses.map(p => ({ title: p.title, amount: p.amount || Math.round(p.amount_twd * currentRate), payer: p.payer })),
        ...userExpenses.map(u => ({ title: u.title, amount: u.amount, payer: u.payer }))
      ];

      if (combined.length === 0) {
        alert('目前沒有記帳資料可供匯出！');
        return;
      }

      let csvContent = "\uFEFF項目,金額(KRW),付款人\n";
      combined.forEach(item => {
        csvContent += `"${item.title}",${item.amount},"${item.payer}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `釜山自由行_記帳明細_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function openTaxiModal(cardData) {
      document.getElementById('modal-title').innerText = cardData.title || '前往目的地';
      document.getElementById('modal-msg').innerText = cardData.message || '안녕하세요! 이 주소로 가주세요.';
      document.getElementById('modal-address').innerText = cardData.address_kr || '';
      document.getElementById('taxi-modal').classList.remove('hidden');
    }

    function closeTaxiModal() {
      document.getElementById('taxi-modal').classList.add('hidden');
    }

    function openStationModal(title, imgSrc, desc, typeLabel) {
      document.getElementById('station-title').innerText = title;
      document.getElementById('station-img').src = imgSrc;
      document.getElementById('station-desc').innerText = desc || '尚無備註說明';
      document.getElementById('station-type-label').innerText = typeLabel || '站點說明';
      document.getElementById('station-modal').classList.remove('hidden');
    }

    function closeStationModal() {
      document.getElementById('station-modal').classList.add('hidden');
    }

    function openImageModal(imgSrc) {
      document.getElementById('enlarged-image').src = imgSrc;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
    }

    window.onload = initApp;
  </script>
</body>
</html>
