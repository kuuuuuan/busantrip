<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>釜山 4天自由行</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: 8-bit 點陣字型 + 內文「粉圓體 (jf open huninn)」 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pixel: {
              cream: '#FAF3D3',    /* 主頁面奶白背景色 */
              card: '#FFFFFF',     /* 卡片純白底色 */
              blue: '#38647A',     /* Banner 點陣藍主體色 */
              sky: '#5389A3',      /* 次要藍/網點藍 */
              red: '#ED4C4C',      /* 懷舊點陣紅 */
              grass: '#8CBF26',    /* のびた草 綠色 */
              darkgrass: '#6A9915'
            }
          },
          fontFamily: {
            sans: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'sans-serif'],
            pixel: ['"DotGothic16"', '"Press Start 2P"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* 1. 全局背景：奶白底色 + 半色調點陣 */
    body {
      background-color: #FAF3D3;
      background-image: radial-gradient(#E5D7A0 25%, transparent 25%);
      background-size: 8px 8px;
      color: #38647A;
      min-height: 100vh;
      image-rendering: pixelated;
      position: relative;
    }

    /* 2. 重置背景：超高大天空比例，列車縮小壓至左下角 */
    .busan-bg-illustration {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      opacity: 0.38;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    /* 3. Banner 藍色主卡片 */
    .banner-card {
      background-color: #38647A;
      background-image: 
        repeating-linear-gradient(45deg, rgba(83, 137, 163, 0.25) 0, rgba(83, 137, 163, 0.25) 4px, transparent 4px, transparent 8px);
      border: 4px solid #1E3A4A;
      box-shadow: 0 8px 0px #1E3A4A;
      border-radius: 16px;
      position: relative;
    }

    .banner-card::before, .banner-card::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 14px;
      height: 24px;
      background-color: #38647A;
      border: 4px solid #1E3A4A;
      transform: translateY(-50%);
      z-index: 10;
    }
    .banner-card::before { left: -14px; border-right: none; border-radius: 6px 0 0 6px; }
    .banner-card::after { right: -14px; border-left: none; border-radius: 0 6px 6px 0; }

    /* 4. 特徵造型：卡帶凸邊外形 (Pixel Jigsaw Card) */
    .pixel-card {
      background-color: #FFFFFF;
      border: 4px solid #38647A;
      box-shadow: 0 8px 0px #38647A;
      border-radius: 16px;
      position: relative;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .pixel-card::before, .pixel-card::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 14px;
      height: 24px;
      background-color: #FFFFFF;
      border: 4px solid #38647A;
      transform: translateY(-50%);
      z-index: 10;
    }
    .pixel-card::before { left: -14px; border-right: none; border-radius: 6px 0 0 6px; }
    .pixel-card::after { right: -14px; border-left: none; border-radius: 0 6px 6px 0; }

    .pixel-card:hover {
      transform: translateY(-6px) rotate(-0.5deg);
      box-shadow: 0 14px 0px #38647A;
    }

    /* 5. Day 切換區塊 & 高顯眼度 Tab 按鈕 */
    .tab-container {
      background-color: #38647A;
      border: 4px solid #1E3A4A;
      box-shadow: 0 6px 0 #1E3A4A;
      border-radius: 20px;
    }

    .day-tab {
      background-color: #FFFFFF;
      color: #38647A;
      border: 3px solid #1E3A4A;
      box-shadow: 0 4px 0 #1E3A4A;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'DotGothic16', monospace;
    }
    .day-tab:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 #1E3A4A;
      background-color: #EFE5B8;
    }
    .day-tab:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1E3A4A;
    }

    .day-tab-active {
      background-color: #ED4C4C !important;
      color: #FFFFFF !important;
      border-color: #1E3A4A !important;
      box-shadow: 0 6px 0 #1E3A4A !important;
      transform: translateY(-4px);
    }

    @keyframes pixel-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-pixel-bounce {
      animation: pixel-bounce 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="pb-20 font-sans">

  <!-- 大天空高佔比、小型列車位於左下角的插畫背景 -->
  <div class="busan-bg-illustration">
    <svg class="w-full h-full object-cover object-bottom" viewBox="0 0 1000 1200" preserveAspectRatio="xMidYMax slice" fill="none" xmlns="http://www.w3.org/2000/svg">
      
      <!-- 1. 超高留白大天空 (佔據畫面上方 65% 以上) -->
      <!-- 天空電線桿橫向線條 -->
      <path d="M0 420Q500 480 1000 420M0 460Q500 520 1000 460M0 500Q500 560 1000 500" stroke="#38647A" stroke-width="2" stroke-dasharray="8 4" opacity="0.45"/>

      <!-- 2. 電線桿結構 (主要伸展在左側與天空) -->
      <g id="left-utility-pole">
        <rect x="50" y="250" width="16" height="750" fill="#38647A"/>
        <rect x="10" y="320" width="100" height="12" fill="#38647A"/>
        <rect x="0" y="380" width="130" height="12" fill="#38647A"/>
      </g>

      <!-- 3. 大海海平線 (位置壓低至 y=760) -->
      <rect x="0" y="760" width="1000" height="180" fill="#38647A" fill-opacity="0.22"/>
      <path d="M0 760h1000v10H0z" fill="#38647A" opacity="0.4"/>
      <!-- 海浪像素幾何層次 -->
      <rect x="120" y="790" width="100" height="6" fill="#38647A" opacity="0.25"/>
      <rect x="450" y="830" width="160" height="6" fill="#38647A" opacity="0.25"/>
      <rect x="750" y="800" width="120" height="6" fill="#38647A" opacity="0.25"/>

      <!-- 4. 右側路口號誌桿與紅綠燈 (完美符合海報構圖) -->
      <g id="traffic-light">
        <rect x="680" y="550" width="14" height="400" fill="#38647A"/>
        <rect x="620" y="620" width="140" height="30" fill="#1E3A4A" rx="4"/>
        <circle cx="650" cy="635" r="9" fill="#ED4C4C"/>
        <circle cx="690" cy="635" r="9" fill="#EFE5B8"/>
        <circle cx="730" cy="635" r="9" fill="#38647A"/>
      </g>

      <!-- 5. 左下角精緻小型海濱列車 (Busan Tram) -->
      <!-- 寬度由原本的 760 縮小至 480，顯著降低占比並向左靠 -->
      <g id="small-busan-tram">
        <!-- 主車身 -->
        <rect x="-40" y="810" width="500" height="150" rx="10" fill="#38647A"/>
        <rect x="-30" y="850" width="480" height="95" fill="#FAF3D3"/>
        <rect x="-30" y="900" width="480" height="45" fill="#ED4C4C"/> <!-- 下半部經典懷舊紅 -->

        <!-- 觀景車窗 -->
        <rect x="20" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <rect x="105" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <rect x="190" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <rect x="275" y="830" width="65" height="50" rx="3" fill="#1E3A4A"/>
        <!-- 車頭駕駛窗 -->
        <rect x="360" y="825" width="100" height="60" rx="6" fill="#1E3A4A"/>

        <!-- 車窗光澤線 -->
        <path d="M25 835l25 40h-12l-25-40zm85 0l25 40h-12l-25-40zm85 0l25 40h-12l-25-40zm85 0l25 40h-12l-25-40z" fill="#5389A3" opacity="0.6"/>

        <!-- 列車車身標字 -->
        <rect x="30" y="910" width="130" height="18" rx="3" fill="#FAF3D3"/>
        <text x="36" y="923" font-family="monospace" font-size="9" font-weight="bold" fill="#ED4C4C">BUSAN TRAM</text>

        <!-- 列車車輪 -->
        <circle cx="80" cy="960" r="18" fill="#1E3A4A"/>
        <circle cx="80" cy="960" r="8" fill="#FAF3D3"/>
        <circle cx="400" cy="960" r="18" fill="#1E3A4A"/>
        <circle cx="400" cy="960" r="8" fill="#FAF3D3"/>
      </g>

      <!-- 6. 極底部薄薄一層馬路與斑馬線 (避免地面過重) -->
      <rect x="0" y="960" width="1000" height="240" fill="#38647A" opacity="0.25"/>
      <!-- 馬路雙黃線 -->
      <path d="M0 980h1000M0 990h1000" stroke="#EFE5B8" stroke-width="4" stroke-dasharray="24 12"/>
      <!-- 斑馬線斜條紋 -->
      <g fill="#FAF3D3" opacity="0.85">
        <rect x="520" y="1000" width="35" height="80" transform="skewX(-25)"/>
        <rect x="585" y="1000" width="35" height="80" transform="skewX(-25)"/>
        <rect x="650" y="1000" width="35" height="80" transform="skewX(-25)"/>
        <rect x="715" y="1000" width="35" height="80" transform="skewX(-25)"/>
        <rect x="780" y="1000" width="35" height="80" transform="skewX(-25)"/>
        <rect x="845" y="1000" width="35" height="80" transform="skewX(-25)"/>
      </g>
    </svg>
  </div>

  <!-- 頂部釜山形象 Header (點陣藍色主體 Banner) -->
  <header class="max-w-4xl mx-auto mt-6 px-4">
    <div class="banner-card p-6 md:p-8 text-center relative overflow-hidden text-white">
      
      <!-- 8-Bit 邊角點陣點綴 -->
      <div class="absolute top-2 left-2 text-[10px] text-pixel-cream/40 font-pixel leading-none select-none">■□<br>□■</div>
      <div class="absolute top-2 right-2 text-[10px] text-pixel-cream/40 font-pixel leading-none select-none">□■<br>■□</div>

      <!-- 頂部標籤 -->
      <div class="inline-block bg-pixel-red text-white text-xs px-3 py-1 border-2 border-[#1E3A4A] rounded-md mb-3 font-pixel tracking-widest shadow-sm animate-pixel-bounce">
        <i class="fa-solid fa-plane-arrival mr-1"></i> BUSAN TRAVEL GUIDE 2026
      </div>
      
      <!-- 標題＆副標 -->
      <h1 class="text-3xl md:text-5xl font-black font-pixel tracking-widest my-2 mb-4 text-pixel-cream drop-shadow-[0_4px_0_#1E3A4A]">
        Busan ４天３夜自由行
      </h1>

      <!-- Banner 副標題與底部裝飾：點陣海浪與小船 Pixel SVG -->
      <div class="flex justify-between items-end px-6 mt-6 border-b-2 border-dashed border-pixel-cream/20 pb-2 select-none">
        
        <!-- SVG Pixel 海浪與小船 (左) -->
        <svg class="w-8 h-5 opacity-90" viewBox="0 0 32 20" fill="#FAF3D3" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2h4v8h-4zm-8 8h16v3H4zm-4 3h24v4H0z"/>
        </svg>

        <!-- 中央標語 -->
        <div class="flex items-center justify-center gap-3 text-pixel-cream/90 text-sm md:text-base font-pixel mt-3"> 
          <span>Made By Kuan</span>
        </div>

        <!-- SVG Pixel 海浪與小船 (右) -->
        <svg class="w-8 h-5 opacity-90" viewBox="0 0 32 20" fill="#FAF3D3" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2h4v8h-4zm-8 8h16v3H4zm-4 3h24v4H0z"/>
        </svg>

      </div>
    </div>
  </header>

  <!-- 天數切換 Tab (點陣藍底框 + 高對比切換按鈕) -->
  <main class="max-w-4xl mx-auto px-4 mt-8">
    <div class="tab-container flex justify-between gap-3 p-3 mb-8 overflow-x-auto">
      <button onclick="switchDay(1)" id="tab-1" class="day-tab day-tab-active flex-1 min-w-[75px] py-3 text-center rounded-xl font-pixel">
        Day 1
      </button>
      <button onclick="switchDay(2)" id="tab-2" class="day-tab flex-1 min-w-[75px] py-3 text-center rounded-xl font-pixel">
        Day 2
      </button>
      <button onclick="switchDay(3)" id="tab-3" class="day-tab flex-1 min-w-[75px] py-3 text-center rounded-xl font-pixel">
        Day 3
      </button>
      <button onclick="switchDay(4)" id="tab-4" class="day-tab flex-1 min-w-[75px] py-3 text-center rounded-xl font-pixel">
        Day 4
      </button>
    </div>

    <!-- 行程動態載入區 -->
    <div id="itinerary-container" class="space-y-8">
      <!-- JS 會將 JSON 資料動態渲染至此 -->
      <div class="pixel-card p-10 text-center text-pixel-blue font-pixel">
        <i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-pixel-red"></i>
        <p class="text-base">載入釜山行程資料中...</p>
      </div>
    </div>
  </main>

  <!-- 司機溝通大字報 Modal -->
  <div id="taxi-modal" class="fixed inset-0 bg-pixel-blue/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="pixel-card max-w-lg w-full p-6 text-center relative border-4 border-pixel-blue bg-[#FFFFFF] shadow-2xl">
      <button onclick="closeTaxiModal()" class="absolute top-3 right-3 text-pixel-blue hover:text-pixel-red text-2xl font-pixel transition-transform hover:rotate-90">
        <i class="fa-solid fa-square-xmark"></i>
      </button>
      
      <div class="inline-block bg-pixel-red text-white text-xs px-3 py-1 rounded border-2 border-pixel-blue mb-3 font-pixel">
        <i class="fa-solid fa-taxi mr-1"></i> 計程車大字報 (기사님께 보여주세요)
      </div>
      
      <h3 id="modal-title" class="text-lg font-bold text-pixel-blue mb-3 font-pixel">目的地</h3>
      
      <!-- 超大韓文文字展示區 -->
      <div class="bg-pixel-cream/40 rounded-xl p-5 mb-4 border-3 border-pixel-blue shadow-inner">
        <p id="modal-msg" class="text-2xl md:text-3xl text-slate-900 leading-snug tracking-wide font-pixel">
          안녕하세요! 기사님, 이 주소로 가주세요.
        </p>
        <hr class="my-3 border-dashed border-pixel-blue/30">
        <p class="text-xs text-pixel-blue/60 mb-1 font-pixel">韓文地址 (Address):</p>
        <p id="modal-address" class="text-sm text-pixel-red font-pixel select-all">
          주소 정보
        </p>
      </div>
      
      <p class="text-xs text-pixel-blue/70 font-pixel">💡 提示：按住文字可複製地址或直接出示手機畫面給司機看。</p>
    </div>
  </div>

  <!-- JavaScript 腳本 -->
  <script>
    let itineraryData = [];
    let currentDay = 1;

    // 1. 初始化：載入 JSON 檔案
    async function fetchItinerary() {
      try {
        const response = await fetch('data/itinerary.json');
        if (!response.ok) throw new Error('無法讀取行程資料');
        itineraryData = await response.json();
        renderDay(currentDay);
      } catch (error) {
        console.error(error);
        document.getElementById('itinerary-container').innerHTML = `
          <div class="pixel-card p-8 text-center text-pixel-red font-pixel">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p>資料載入失敗，請確認 data/itinerary.json 檔案路徑是否正確。</p>
          </div>
        `;
      }
    }

    // 2. 切換 Day Tab
    function switchDay(day) {
      currentDay = day;
      document.querySelectorAll('.day-tab').forEach((tab, index) => {
        if (index + 1 === day) {
          tab.classList.add('day-tab-active');
        } else {
          tab.classList.remove('day-tab-active');
        }
      });
      renderDay(day);
    }

    // 3. 渲染當天行程卡片
    function renderDay(day) {
      const container = document.getElementById('itinerary-container');
      const dayData = itineraryData.filter(item => item.day === day);

      if (dayData.length === 0) {
        container.innerHTML = `<div class="pixel-card p-10 text-center text-pixel-blue font-pixel">尚無第 ${day} 天的行程資料。</div>`;
        return;
      }

      container.innerHTML = dayData.map(spot => {
        // 成員標籤 (Kuan / Lily)
        const travelersHtml = spot.travelers ? spot.travelers.map(t => {
          const isKuan = t === 'Kuan';
          const bgClass = isKuan ? 'bg-blue-100 text-blue-900 border-blue-900' : 'bg-pink-100 text-pink-900 border-pink-900';
          return `<span class="inline-block border-2 px-2 py-0.5 rounded text-xs font-pixel mr-1 ${bgClass}"><i class="fa-solid fa-user text-[10px] mr-1"></i>${t}</span>`;
        }).join('') : '';

        // 交通方式區塊
        const transitHtml = spot.transit_options && spot.transit_options.length > 0 ? `
          <div class="mt-4 pt-3 border-t-2 border-dashed border-pixel-blue/30 space-y-2">
            <p class="text-xs font-pixel text-pixel-blue/70 uppercase"><i class="fa-solid fa-route mr-1"></i>交通與轉乘方式：</p>
            ${spot.transit_options.map(t => `
              <div class="bg-pixel-cream/30 p-3 rounded-lg border-2 border-pixel-blue text-sm font-sans">
                <div class="flex justify-between items-center mb-1 font-pixel">
                  <span class="text-pixel-red"><i class="fa-solid fa-bus-simple mr-1"></i>${t.type}</span>
                  <span class="text-xs bg-pixel-blue/10 text-pixel-blue px-2 py-0.5 rounded border border-pixel-blue">₩${t.cost_krw.toLocaleString()} (${t.duration_mins}分)</span>
                </div>
                <p class="text-xs text-pixel-blue">${t.route_description}</p>
                ${t.board_zh ? `<p class="text-xs text-slate-600 mt-1">上車：${t.board_zh} (${t.board_kr})</p>` : ''}
                ${t.transfer_zh ? `<p class="text-xs text-pixel-red mt-0.5">轉乘：${t.transfer_zh}</p>` : ''}
                ${t.alight_zh ? `<p class="text-xs text-slate-600 mt-0.5">下車：${t.alight_zh} (${t.alight_kr})</p>` : ''}
              </div>
            `).join('')}
          </div>
        ` : '';

        // 大字報按鈕
        const taxiBtnHtml = spot.taxi_card ? `
          <button onclick='openTaxiModal(${JSON.stringify(spot.taxi_card)})' class="mt-4 w-full bg-pixel-red hover:bg-red-600 text-white border-2 border-pixel-blue font-pixel text-xs py-2.5 px-4 rounded-xl flex items-center justify-center transition-transform hover:scale-[1.01] active:scale-95 shadow-[0_3px_0_#1E3A4A]">
            <i class="fa-solid fa-taxi mr-2"></i>開啟計程車溝通大字報 (司機指示)
          </button>
        ` : '';

        return `
          <div class="pixel-card p-5 md:p-6 relative">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-pixel text-white bg-pixel-blue px-2.5 py-1 rounded border border-pixel-blue">
                <i class="fa-regular fa-clock mr-1"></i>${spot.time}
              </span>
              <div>${travelersHtml}</div>
            </div>

            <h2 class="text-xl md:text-2xl text-pixel-blue my-2 flex items-center justify-between font-sans">
              <span>${spot.spot_zh}</span>
              ${spot.naver_link ? `
                <a href="${spot.naver_link}" target="_blank" class="text-xs font-pixel text-emerald-800 bg-emerald-200 hover:bg-emerald-300 px-2.5 py-1 rounded border-2 border-emerald-800 ml-2 flex-shrink-0 transition-transform hover:scale-105">
                  <i class="fa-solid fa-map-location-dot mr-1"></i>Naver Map
                </a>
              ` : ''}
            </h2>
            <p class="text-xs font-pixel text-pixel-blue/60 mb-3">${spot.spot_kr || ''}</p>

            ${spot.notes ? `
              <div class="bg-pixel-cream/50 p-3 rounded-lg border-2 border-pixel-blue text-xs text-pixel-blue leading-relaxed font-sans">
                <i class="fa-solid fa-circle-info text-pixel-red mr-1"></i><strong>注意事項：</strong> ${spot.notes}
              </div>
            ` : ''}

            ${transitHtml}
            ${taxiBtnHtml}
          </div>
        `;
      }).join('');
    }

    // 4. Modal 大字報控制
    function openTaxiModal(cardData) {
      document.getElementById('modal-title').innerText = cardData.title || '前往目的地';
      document.getElementById('modal-msg').innerText = cardData.message || '안녕하세요! 이 주소로 가주세요.';
      document.getElementById('modal-address').innerText = cardData.address_kr || '';
      document.getElementById('taxi-modal').classList.remove('hidden');
    }

    function closeTaxiModal() {
      document.getElementById('taxi-modal').classList.add('hidden');
    }

    // 頁面載入時執行 fetch
    window.onload = fetchItinerary;
  </script>
</body>
</html>
